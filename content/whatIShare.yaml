eyebrow: What you'll find here
headline: "Three things I do.\nAll of it free."
sub: >-
  I write to share what I learn at the intersection of enterprise architecture
  and AI, build demos to make complex ideas concrete, and host a community
  where practitioners help each other. No charge. Ever.
items:
  - num: '01'
    title: Enterprise AI Perspectives
    desc: >-
      I write about the real challenges of integrating AI into enterprise
      landscapes — SAP ecosystems, headless architecture, agentic systems,
      inference economics, and context engineering. Written for technical
      leaders making high-stakes decisions.
    link: '#perspectives'
    cta: Read my writing
  - num: '02'
    title: Demo Systems & Experiments
    desc: >-
      I build AI systems to make abstract concepts concrete for enterprise
      audiences. Each demo is live and documented with architecture decisions,
      not just output.
    link: '#work'
    cta: Explore demos
  - num: '03'
    title: The AI Edge — Free Community
    desc: >-
      A free monthly session where practitioners learn to apply AI in real
      enterprise environments. No fees, no upsells — just rigorous, practical
      learning with peers.
    link: '#edge'
    cta: Join for free
